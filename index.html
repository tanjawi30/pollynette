<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pollynette Fan Club 💖</title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive;
      background: #ffe6f2;
      color: #d63384;
      text-align: center;
      margin: 0;
      padding: 0;
      background-image: url('[i.imgur.com](https://i.imgur.com/kVeDox8.png)');
      background-repeat: repeat;
      background-size: contain;
    }
    .container {
      padding-top: 100px;
    }
    button {
      background-color: #ff66b2;
      border: none;
      border-radius: 10px;
      color: white;
      padding: 15px 25px;
      font-size: 20px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #ff3399;
    }
    h1 {
      font-size: 3em;
    }
    .skull {
      width: 150px;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Bienvenue chez Pollynette 💋</h1>
    <p>Connecte-toi avec ton compte Twitch pour continuer</p>
    <button onclick="alert('Plus tard ici il y aura la connexion Twitch ⚡')">Se connecter avec Twitch</button>
    <br><br>
    <img class="skull" src="[i.imgur.com](https://i.imgur.com/whzXpgB.png)" alt="logo Pollynette">
  </div>
</body>
</html>
